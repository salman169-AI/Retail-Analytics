# School cafe with a staffed snack counter (MEVA G421, high corner camera).
# Video: MEVA dataset (mevadata.org), CC BY 4.0
#
# Demo/eval clip below; tracker settings were tuned on a *different* clip from
# the same camera (2018-03-07.16-50-00.16-55-00.school.G421) so phase-4 numbers stay out-of-sample.

io:
  source: "data/meva/clips/2018-03-07.17-20-00.17-25-00.school.G421.r13.avi"
  output_dir: "outputs/meva"
  max_frames: null

meva:
  tune_clip: "2018-03-07.16-50-00.16-55-00.school.G421"

detector:
  model: "yolo26m.pt"
  weights_dir: "weights"
  device: "cuda:0"
  confidence: 0.25
  iou: 0.7
  classes: [0]
  slicer:
    enabled: false

tracker:
  name: "botsort"
  reid_model: "lmbn"
  track_buffer: 60
  appearance_thresh: 0.25
  match_thresh: 0.8
  use_cmc: false            # fixed CCTV camera: no camera motion to compensate

# Gallery on, but stricter than the 0.55 default: on the tuning clip 0.65 gave
# the same 44 identity switches with far less merging (31 ids vs 21), and
# 0.55 merged different people at the entrance and in the gym.
reid_gallery:
  enabled: true
  cosine_thresh: 0.65
  time_window_s: 120
  max_gallery_size: 500
  ema_alpha: 0.9

# Zones and queue drawn on this clip's own scene from a detector-only foot map
# (outputs/meva/phase2/feet_cafe.jpg). Furniture differs between days, so each
# demo clip gets its own geometry; no tracking outcome was used to place them.
zones:
  - name: "lounge"
    polygon: [[120, 343], [500, 289], [574, 434], [143, 529]]
  - name: "tables"
    polygon: [[350, 496], [868, 400], [1060, 602], [388, 742]]
  - name: "coffee station"
    polygon: [[1690, 598], [1924, 685], [1519, 1082], [1045, 923]]





queues:
  - name: "counter queue"
    polygon: [[320, 804], [697, 730], [1252, 574], [1541, 665], [736, 1069], [392, 1067]]
    anchor: "bottom_center"
    max_speed: 0.5
    min_visit_s: 3.0
    recent: 10





# Behind the counter, where the server stands (box centre: the counter hides
# their legs). Provisional: redraw with `people-analytics zone-editor`.
staff:
  name: "behind the counter"
  polygon: [[-1, 706], [173, 676], [280, 1072], [0, 1072]]
  anchor: "center"
  queue: "counter queue"
  alert_after_s: 120
  min_waiting: 1
  back_after_s: 1.0
  repeat_after_s: 300





# Alerts are always written to outbox_dir as .eml files. To email them too, set
# enabled: true, fill in the addresses, and put an app password in the
# ALERT_SMTP_PASSWORD environment variable (never in this file).
notify:
  site_name: "Cafe"
  outbox_dir: "outputs/alerts"
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password_env: "ALERT_SMTP_PASSWORD"
    sender: ""
    to: []

analytics:
  smoothing_window: 3
  heatmap: true
  anchor: "bottom_center"
  interpolate: true
  interpolate_max_gap: 20
  min_dwell_s: 3.0

privacy:
  enabled: false
  method: "blur"
