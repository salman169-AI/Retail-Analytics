# Phase 1 shortlist of MEVA clips, five per role (15 clips, ~2.6 GB).
# Picked from `people-analytics meva-rank` output + the KF1 site map
# (data/meva/kf1-metadata/meva-kf1-metadata/meva-kf1-site-map.pdf).
# Video: MEVA dataset (mevadata.org), CC BY 4.0

annotations: "data/meva/meva-data-repo"
cameras_csv: "data/meva/kf1-metadata/meva-kf1-metadata/meva-kf1-cameras.csv"
clips_dir: "data/meva/clips"
output_dir: "outputs/meva"

roles:
  # Building entrance with a clear doorway, for in/out counting.
  # G419/G420: inside the school's east doors (site map "doors"), looking down at
  # them. G638: outside the school's main entrance (site map "plaza").
  entrance:
    - "2018-03-09.10-40-01.10-45-01.school.G420"
    - "2018-03-13.16-30-01.16-35-01.school.G420"
    - "2018-03-09.10-40-00.10-45-00.school.G419"
    - "2018-03-13.17-05-00.17-10-00.school.G638"
    - "2018-03-13.15-50-00.15-55-00.school.G638"

  # Indoor café with a counter (G421, the only café camera), plus the bus-station
  # waiting room (G331) as the plan's fallback.
  cafe:
    - "2018-03-15.15-40-00.15-45-00.school.G421"
    - "2018-03-13.15-55-00.16-00-00.school.G421"
    - "2018-03-07.17-20-00.17-25-00.school.G421"
    # Second café clip in the same staffed-counter session as 17-20 (picked 2026-10-02).
    - "2018-03-07.16-50-00.16-55-00.school.G421"
    - "2018-03-07.17-30-00.17-35-00.bus.G331"
    - "2018-03-07.11-00-00.11-05-00.bus.G331"

  # Wide, busy view with a lot of visible floor, for the heatmap.
  # G299/G330: the gym (these two have calibrated camera models). G436/G336:
  # outdoor roads and lots.
  wide:
    - "2018-03-11.11-50-00.11-55-00.school.G330"
    - "2018-03-09.10-15-00.10-20-00.school.G330"
    - "2018-03-09.10-15-00.10-20-00.school.G299"
    - "2018-03-13.17-10-03.17-15-02.hospital.G436"
    - "2018-03-13.16-10-03.16-15-03.school.G336"
