# ~55 s demo, cafe camera only: `people-analytics demo-video`.
# Every shot <= 15 s and captioned (most viewers watch muted). All numbers on
# screen come from this repo's runs: live counts from the run exports, the
# results card from metrics/*.json.
# Video: MEVA dataset (mevadata.org), CC BY 4.0

out: "outputs/meva/demo/meva_demo.mp4"
thumbnail: "outputs/meva/demo/thumbnail.png"
thumbnail_at: [1, 10.5]    # [shot index, seconds into it]: the alert banner
author: "Salman Majeed"
fps: 30

shots:
  - kind: scene
    config: "configs/meva_cafe.yaml"
    title: "Cafe"
    start_s: 50
    seconds: 14
    caption: "Cafe analytics: queue, wait and time per area"
    sub: "Everyone is tracked; people waiting at the counter are highlighted in orange"

  # The server steps out of view once in this clip (2:29, for 2 s). The alert
  # normally waits 2 minutes; it is lowered here so that real moment shows it.
  - kind: scene
    config: "configs/meva_cafe.yaml"
    title: "Cafe"
    start_s: 141
    seconds: 15
    overrides: {"staff.alert_after_s": 1.5, "staff.back_after_s": 0.5}
    caption: "Alert: customers waiting, nobody behind the counter"
    sub: "Shown with a 1.5 s threshold, as the server steps away only briefly here (default: 2 minutes)"

  - kind: email
    seconds: 7
    config: "configs/meva_cafe.yaml"
    overrides: {"staff.alert_after_s": 1.5, "staff.back_after_s": 0.5}
    caption: "The manager gets an email"
    sub: "Sent through any ordinary email account (SMTP): no paid service needed"

  - kind: summary
    seconds: 8
    panels:
      - {config: "configs/meva_cafe.yaml", title: "Cafe"}
    caption: "End-of-clip summary"
    sub: "Visits per minute and average time per area, for the full 5-minute clip."

  - kind: measured
    seconds: 6
    items: [cafe_idsw]

  - kind: end
    seconds: 6
    title: ["Queues, dwell time and staff alerts", "with occlusion-robust tracking"]
